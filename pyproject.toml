[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "marl-based-mapf"
version = "0.1.0"
description = "Research project, that tries to improve the LaCAM algorithm by using multi agent reinforcement learning"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Carsten Scholle", email = "carsten.scholle@gmail.com"}]
dependencies = [
    "torch",
    "torchvision",
    "torchviz",
    "loguru",
    "matplotlib"
]


[project.optional-dependencies]
dev =  [
    "pytest"
]


[project.urls]
Repository = "https://github.com/scholle-c/marl-based-mapf"


[project.scripts]
mapf-pipe = "MARL_MAPF_pipeline.cli:main"


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
